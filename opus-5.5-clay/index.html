  specs.forEach(([sign, col], i) => {
    const g = c.add(new THREE.Group(), DX[i], 0, -.8);

    const lintel = M(roundBox(2.0, .26, .38, .06), C.brown, .008); lintel.position.y = 2.8; g.add(lintel);

    const hinge = new THREE.Group(); hinge.position.set(-.72, 0, .02); g.add(hinge);

    for (const py of [.75, 1.85]) { const panel = M(roundBox(1.0, .8, .03, .04), new THREE.Color(col).multiplyScalar(.82).getHex(), 0); panel.position.set(.71, py, .07); hinge.add(panel); }

    b.traverse(o => { if (o.isMesh) o.castShadow = false; });

  // door 1: a padlock, and the error it threw
  const lock = new THREE.Group(); lock.add(M(roundBox(.36, .32, .16, .05), 0xC9A24A, .006));
  const sh = M(new THREE.TorusGeometry(.12, .035, 10, 24, Math.PI), 0x9a9a9a, 0); sh.position.y = .16; lock.add(sh);
  c.add(lock, DX[0] + .45, 1.25, -.62); c.pop(lock, c.at(1, 'security') - .1, .35);
  const t1 = tile('✗ CERTIFICATE_VERIFY_FAILED', 0xE9A6A0, DX[0]); c.pop(t1, c.at(1, 'failed'), .4);
  // door 2: a boom barrier drops across it

  for (let k = 0; k < 6; k++) { const seg = M(roundBox(.32, .14, .14, .05), k % 2 ? C.white : C.red, .004); seg.position.x = .17 + k * .32; boom.add(seg); }
  const tB = c.at(2, 'blocked') - .35; c.pop(boom, tB - .3, .25);
  c.on(lt => { boom.rotation.z = Math.PI / 2 * (1 - bounce(P(lt, tB, .5))); });
  c.ev(tB + .3, 'bonk');
  const t2 = tile('✗ 403 · blocked by policy', 0xE9A6A0, DX[1]); c.pop(t2, c.at(2, 'blocked'), .4);

  c.ev(tOpen, 'zip');
  const t3 = tile('✓ kokoro-v1.0.onnx · 325 MB', 0xA8D5A2, DX[2]); c.pop(t3, c.at(3, 'Kokoro') - .1, .4);

    // through the open door, then back out

    bot.position.z -= k2 * 1.9; if (k2 > .05 && k2 < .95) bot.rotation.y = Math.PI;
    bot.userData.parts.wheels.forEach(w => w.rotation.x = -x * 3);

  for (let k = 0; k < 6; k++) for (const s2 of [-1, 1]) { const pinA = M(roundBox(.06, .05, .2, .01), 0xC9A24A, 0); pinA.position.set(-.4 + k * .16, -.03, s2 * .62); chip.add(pinA); const pinB = pinA.clone(); pinB.rotation.y = Math.PI / 2; pinB.position.set(s2 * .62, -.03, -.4 + k * .16); chip.add(pinB); }
  const cd = decal(.8, .8, (gg, W, H) => { gg.fillStyle = '#e9e5dc'; fitText(gg, 'CPU', W, H, 700, '"JetBrains Mono"', .4); }, 400); cd.rotation.x = -Math.PI / 2; cd.position.y = .09; chip.add(cd);
  c.add(chip, DX[2] + .1, .12, 1.7); c.pop(chip, c.at(4, 'processor') - .3, .4);
  const spk = new THREE.Group(); spk.add(M(roundBox(.9, 1.2, .7, .1), C.brown, .008));
  const cone = M(new THREE.CylinderGeometry(.34, .12, .12, 32, 1, true), C.dark, 0); cone.rotation.x = Math.PI / 2; cone.position.set(0, -.1, .38); spk.add(cone);
  const cap = M(sphere(.1, 16), C.dark, 0); cap.position.set(0, -.1, .38); spk.add(cap);
  const tw = M(sphere(.09, 16), C.dark, 0); tw.position.set(0, .35, .36); spk.add(tw);
  c.add(spk, DX[2] + 2.0, .6, .6); spk.rotation.y = -.45; c.pop(spk, L[4] - .1, .4);
  const rings = [0, 1, 2].map(k => { const r = new THREE.Mesh(new THREE.TorusGeometry(.5, .03, 8, 40), new THREE.MeshBasicMaterial({ color: 0xFFE08A, transparent: true })); spk.add(r); r.position.set(0, -.1, .45); return r; });
  c.on((lt, T) => { const on = lt > L[4]; const amp = TL.mouth[Math.floor(T * 12)] || 0; rings.forEach((r, k) => { const ph = ((lt * 1.2 + k / 3) % 1); r.visible = on; r.scale.setScalar(.6 + ph * 1.8); r.material.opacity = (1 - ph) * (.25 + amp * .75); }); cone.position.z = .38 + amp * .05; });
  c.cam = lt => {
    const x = botX(lt), k4 = eio(P(lt, L[4] - .5, 1.5)), lx = x * .85 * (1 - k4) + (DX[2] + .9) * k4;
    return { pos: [lx + .4, 3.25, 9.8], look: [lx, 2.0, 0], focus: [x * (1 - k4) + (DX[2] + .6) * k4, 1.6, 0], aperture: .0013 };
  };
}};

DEFS.agent = { build(c) {
  const road = c.add(M(roundBox(10.4, .16, 1.8, .06), 0xCDBB98, .01), .1, .08, 0);
  const wall = c.add(M(roundBox(.42, 1.0, 1.6, .06), 0xB5523B, .01), 1.2, .66, 0);
  for (let r = 0; r < 3; r++) { const l = M(roundBox(.44, .03, 1.62, .01), 0xE8D8C0, 0); l.position.y = -.2 + r * .3; wall.add(l); }
  const flag = c.add(new THREE.Group(), 4.6, .16, -.3);
  const pole = M(cylinder(.05, 2.6, 12), C.dark, 0); pole.position.y = 1.3; flag.add(pole);
  const tri = new THREE.Shape(); tri.moveTo(0, 0); tri.lineTo(.9, -.28); tri.lineTo(0, -.56);
  const cloth = M(new THREE.ExtrudeGeometry(tri, { depth: .04, bevelEnabled: false }), C.red, 0); flag.add(cloth);
  c.pop(road, .05, .4); c.pop(wall, .15, .4); c.pop(flag, .25, .4);
  const bot = c.add(makeRobot(), -4.3, .16, 0); bot.scale.setScalar(.62); bot.rotation.y = Math.PI / 2; c.pop(bot, .35, .4);
  // plan: a dotted route
  const tPlan = c.at(1, 'Plan'), tTry = c.at(1, 'Try'), tHit = c.at(1, 'Hit'), tWhy = c.at(2, 'Figure'), tFix = c.at(2, 'Build'), tAgain = c.at(2, 'again') - .3;
  for (let i = 0; i < 14; i++) { const b = c.add(M(sphere(.07, 12), C.yellow, 0), -3.7 + i * .6, .3, .75); c.pop(b, tPlan + i * .05, .25); }
  // the fix: ramps
  const wedge = (w, h, flip) => { const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(flip ? -w : w, 0); s.lineTo(0, h); const g = new THREE.ExtrudeGeometry(s, { depth: 1.4, bevelEnabled: true, bevelThickness: .04, bevelSize: .04, bevelSegments: 3 }); g.translate(0, 0, -.7); return g; };
  const rampL = c.add(M(wedge(2.2, 1.0, true), C.yellow, .01), .99, .16, 0), rampR = c.add(M(wedge(2.2, 1.0, false), C.yellow, .01), 1.41, .16, 0);
  c.drop(rampL, tFix, 3, .55); c.drop(rampR, tFix + .25, 3, .55);
  const q = c.add(text3d('?', .5, C.orange, .15), 0, 2.2, 0); c.pop(q, tWhy - .15, .35); c.out(q, Math.max(tFix + .5, tWhy + 1.2), .3);
  // route: x(t) and the height of the ground under the robot
  const ground = x => x < -1.21 ? 0 : x < .99 ? (x + 1.21) / 2.2 : x < 1.41 ? 1 : x < 3.61 ? 1 - (x - 1.41) / 2.2 : 0;
  const slope = x => x > -1.21 && x < .99 ? Math.atan(1 / 2.2) : x > 1.41 && x < 3.61 ? -Math.atan(1 / 2.2) : 0;
  const pathX = lt => {
    if (lt < tTry) return -4.3;
    if (lt < tHit) return -4.3 + 5.0 * eio(P(lt, tTry, tHit - tTry));
    if (lt < tAgain) return .7 - 2.3 * eo(P(lt, tHit, .7));
    return -1.6 + (4.1 + 1.6) * eio(P(lt, tAgain, 2.4));
  };
  c.ev(tHit, 'bonk'); c.ev(tAgain, 'zip');
  c.on(lt => {
    const x = pathX(lt);
    bot.position.x = x; bot.position.y = .16 + (lt >= tAgain ? ground(x) : 0);
    bot.rotation.x = 0; bot.rotation.z = 0; bot.rotateOnWorldAxis(new THREE.Vector3(0, 0, 1), lt >= tAgain ? slope(x) : 0);
    if (lt > tHit && lt < tHit + .5) { bot.rotateOnWorldAxis(new THREE.Vector3(0, 0, 1), .25 * Math.sin(P(lt, tHit, .5) * Math.PI)); wall.position.x += Math.sin(lt * 60) * .03 * (1 - P(lt, tHit, .4)); }
    bot.userData.parts.wheels.forEach(w => w.rotation.x = -x * 3.2);
    const done = P(lt, tAgain + 2.4, .6); cloth.position.y = 1.1 + 1.45 * eo(done); cloth.rotation.y = Math.sin(lt * 6) * .15;
    if (done > 0) { bot.rotation.y = Math.PI / 2 + (lt - tAgain - 2.4) * 5 * (1 - P(lt, tAgain + 3.6, .3)); }
  });
  c.cam = lt => { const k = eio(P(lt, c.L[3] - .5, 1.5)); return { pos: [.15, 2.5 + 1.1 * k, 9.9 + 1.5 * k], look: [.15, 1.05 + .7 * k, 0], aperture: .0015 }; };
}};


DEFS.physics = { build(c) {
  const V = THREE.Vector3, H = 1.0, TH = .14, WD = .55, SP = .42;
  const curve = new THREE.CatmullRomCurve3([new V(-5.2, 0, .1), new V(-3.2, 0, 1.3), new V(-1, 0, -.1), new V(1.2, 0, 1.0), new V(3.0, 0, .3)]);
  const len = curve.getLength(), N = Math.floor(len / SP) + 1;
  // physics: each domino is a rigid slab tipping about its front edge, theta'' = (3g / 2H) sin(theta).
  // It hits the next one at the contact angle and passes most of its angular velocity on.
  const thC = Math.asin((SP - TH) / H), dt = 1 / 2000, sims = [];
  let t = 0, w0 = .9, th0 = .06;
  for (let i = 0; i < N; i++) {
    const last = i === N - 1, arr = [];
    let th = th0, w = w0, tt = 0;
    while (true) { arr.push(th); w += 1.5 / H * Math.sin(th) * dt; th += w * dt; tt += dt; if (th >= (last ? Math.PI / 2 - .07 : thC)) break; }
    arr.push(last ? Math.PI / 2 - .07 : thC);
    sims.push({ t0: t, arr, tc: t + tt }); t += tt; w0 = w * .72; th0 = 0;
  }
  const tTip = c.at(1, 'Tip') + .35, tEnd = c.dur - 2.9, f = (tEnd - tTip) / t;   // choose g so the chain fills the shot: time scales as 1/sqrt(g)
  const dom = [], cols = [C.red, C.orange, C.yellow, C.green, C.teal, C.blue, C.purple, C.pink];
  for (let i = 0; i < N; i++) {
    const u = i * SP / len, p = curve.getPointAt(u), tg = curve.getTangentAt(u);
    const piv = c.add(new THREE.Group(), p.x, 0, p.z); piv.rotation.y = Math.atan2(tg.x, tg.z);
    const tilt = new THREE.Group(); tilt.position.z = TH / 2; piv.add(tilt);
    const m = M(roundBox(WD, H, TH, .035), cols[Math.floor(i / 2) % cols.length], .006); m.position.set(0, H / 2, -TH / 2); tilt.add(m);
    for (const s of [-1, 1]) { const dot = M(sphere(.045, 12), C.white, 0); dot.scale.z = .5; dot.position.set(0, s * .22, TH / 2 + .005); m.add(dot); }
    dom.push({ piv, tilt, sim: sims[i] });
    c.pop(piv, .08 + i * .045, .3);
    c.ev(tTip + sims[i].tc * f, 'clack');
  }
  const fin = 1.32;
  const theta = lt => {
    const out = new Array(N).fill(0);
    for (let i = N - 1; i >= 0; i--) {
      const sm = sims[i], ts = (lt - tTip) / f;
      if (ts < sm.t0) { out[i] = 0; continue; }
      if (ts < sm.tc || i === N - 1) { const k = Math.min(sm.arr.length - 1, Math.floor((ts - sm.t0) / dt)); out[i] = sm.arr[k]; continue; }
      const nf = i === N - 2 ? Math.PI / 2 - .07 : fin;
      out[i] = thC + (fin - thC) * cl(out[i + 1] / nf);
    }
    return out;
  };
  // the robot gives the first one a nudge
  const t0v = curve.getTangentAt(0); const bot = c.add(makeRobot(), -5.2 - t0v.x * .95, 0, .1 - t0v.z * .95); bot.scale.setScalar(.55); bot.rotation.y = Math.atan2(curve.getTangentAt(0).x, curve.getTangentAt(0).z);
  c.pop(bot, .3, .4);
  c.on(lt => { const k = P(lt, tTip - .5, .5) * (1 - P(lt, tTip + .1, .4)); bot.translateZ(k * .32); wave(bot, lt, tTip + .6, 1.6); });
  // ball + pins at the end of the line
  const pe = curve.getPointAt(1), te = curve.getTangentAt(1);
  const ball = c.add(M(sphere(.26), C.blue, .01), pe.x + te.x * (H + .05), .26, pe.z + te.z * (H + .05));
  c.pop(ball, .2, .35);
  const hit = tTip + sims[N - 1].t0 * f + (sims[N - 1].tc - sims[N - 1].t0) * f * .75, ROLL = 2.6, dur = 1.1;
  const pins = [];
  [[0, 0], [-.28, .45], [.28, .45]].forEach(([dx, dz], i) => {
    const pin = new THREE.Group(); const body = M(capsule(.12, .42), C.white, .01); body.position.y = .33; pin.add(body);
    const band = M(cylinder(.125, .06, 20), C.red, 0); band.position.y = .5; pin.add(band);
    const side = new V(-te.z, 0, te.x), base = ball.position.clone().add(te.clone().multiplyScalar(ROLL + .3 + dz)).add(side.multiplyScalar(dx));
    c.add(pin, base.x, 0, base.z); pins.push([pin, dx]); c.pop(pin, .3 + i * .05, .3);
  });
  c.ev(hit, 'bonk'); c.ev(hit + dur, 'strike');
  c.on(lt => {
    const th = theta(lt); dom.forEach((d, i) => d.tilt.rotation.x = th[i]);
    const k = P(lt, hit, dur), s = ROLL * (1 - (1 - k) * (1 - k));             // rolls and slows (constant friction)
    ball.position.addScaledVector(te, s); ball.rotation.x += s / .26;
    pins.forEach(([pin, dx], i) => { const q = eo(P(lt, hit + dur + i * .06, .45)); pin.rotation.z = -Math.sign(dx || .3) * q * 1.45; pin.rotation.x = q * .5; pin.position.addScaledVector(te, q * .35); });
  });
  // camera follows the wave of falling dominoes, and so does the focus
  const front = lt => { const ts = (lt - tTip) / f; let j = 0; for (let i = 0; i < N; i++) if (ts >= sims[i].t0) j = i; return lt > hit ? 1.2 : j / (N - 1); };
  c.cam = lt => {
    const u = cl(front(lt)), p = curve.getPointAt(Math.min(1, u)).clone(); if (lt > hit) p.add(te.clone().multiplyScalar(ROLL * P(lt, hit, dur + .4) + .6 * P(lt, hit + dur, .8)));
    const k = P(lt, tTip - .6, 1.2), fx = cl(-3.4 + (p.x + .6 + 3.4) * k, -3.4, 5.2), fz = .5 + (p.z - .5) * k * .6;
    return { pos: [fx + 1.0, 3.6, fz + 7.6], look: [fx, .45, fz], focus: [fx - .3, .45, p.z * k + .5 * (1 - k)], aperture: .0016 };
  };
}};

DEFS.music = { build(c) {
  const KEYS = [67, 69, 71, 72, 74, 76, 77, 79], cols = [C.red, C.orange, C.yellow, C.green, C.teal, C.blue, C.purple, C.pink];
  const mar = c.add(new THREE.Group(), -.5, 0, .1);
  const bars = [];
  KEYS.forEach((m, i) => {
    const x = (i - 3.5) * .62, L = 2.1 - i * .11;
    const b = M(roundBox(.5, .16, L, .06), cols[i], .008); b.position.set(x, 1.35, 0); mar.add(b); bars.push(b);
    const tube = M(cylinder(.12, .9 - i * .07, 20), 0xC9A24A, .006); tube.position.set(x, 1.35 - .1 - (.9 - i * .07) / 2, 0); mar.add(tube);
  });
  for (const s of [-1, 1]) {
    const rail = M(capsule(.07, 5), C.brown, .01); rail.rotation.z = Math.PI / 2; rail.position.set(0, 1.23, s * .62); mar.add(rail);
    for (const e of [-1, 1]) { const leg = M(cylinder(.07, 1.2, 14), C.brown, .01); leg.position.set(e * 2.5, .6, s * .62); mar.add(leg); }
  }
  c.pop(mar, .1, .45);
  // an easel showing the melody as the code it really is
  const easel = c.add(new THREE.Group(), 3.35, 0, -1.5); easel.rotation.y = -.3;
  for (const s of [-1, 1]) { const l = M(cylinder(.05, 2.6, 10), C.brown, 0); l.position.set(s * .55, 1.3, 0); l.rotation.z = -s * .08; easel.add(l); }
  const board = M(roundBox(2.1, 1.35, .08, .04), C.cream, .005); board.position.set(0, 1.85, .08); easel.add(board);
  const d = decal(1.95, 1.2, (g, w, h) => {
    g.fillStyle = '#2a2118'; g.font = `700 ${h * .085}px "JetBrains Mono"`;
    ['// the melody', 'const melody = [', ' [72, _, 76, 74, 72, _, 67, _],', ' [71, _, 74, _, 71, 69, 67, _],', ' [69, _, 72, 71, 69, _, 76, _],', ' [77, 76, 74, _, 72, _, _, _],', '];'].forEach((ln, i) => { g.fillStyle = i ? '#2a2118' : '#8a7a60'; g.fillText(ln, w * .04, h * (.13 + i * .125)); });
  }, 900);
  d.position.set(0, 1.85, .13); easel.add(d);
  c.pop(easel, .25, .45);
  // mallets: alternate hands, arc from note to note, strike on the beat
  const notes = TL.notes.filter(([t]) => t >= c.info.start && t < c.info.start + c.dur).map(([t, m]) => [t - c.info.start, KEYS.indexOf(m)]);
  const mallets = [C.purple, C.red].map((col, h) => {
    const g = new THREE.Group(); const stick = M(cylinder(.035, 1.25, 10), 0xE8D2A6, 0); stick.position.set(h ? .18 : -.18, .34, .5); stick.rotation.set(1.0, 0, h ? -.3 : .3); g.add(stick);
    const head = M(sphere(.14, 24), col, .01); g.add(head);
    mar.add(g); c.pop(g, .45 + h * .1, .35); return g;
  });
  const seqs = [[], []]; notes.forEach((n, i) => seqs[i % 2].push(n));
  const barTop = 1.35 + .08 + .14;
  c.on(lt => {
    mallets.forEach((g, h) => {
      const sq = seqs[h], restX = (h ? 1.4 : -1.4);
      let x = restX, y = barTop + .75, z = .15;
      const next = sq.findIndex(([t]) => t > lt), prev = next === -1 ? sq.length - 1 : next - 1;
      const A = prev >= 0 ? sq[prev] : [lt - 1, null], B = next >= 0 ? sq[next] : null;

      if (B) { const span = Math.min(1.2, B[0] - A[0]), k = cl(1 - (B[0] - lt) / span); x = xa + (xb - xa) * eio(k); y = barTop + Math.sin(Math.PI * k) * .7 * Math.min(1, span / .5) + (k < .02 && A[1] == null ? .75 : 0); if (A[1] == null) y = barTop + .75 * (1 - eio(k)) + Math.sin(Math.PI * k) * .2; }
      else { const k = P(lt, A[0], .5); x = xa + (restX - xa) * eio(k); y = barTop + .75 * eo(k); }

      if (B && B[0] - lt < 1 / 12 && B[0] - lt >= 0) y = barTop - .02;

    bars.forEach((b, i) => { let e = 0; for (const [t, k] of notes) if (k === i && lt >= t - 1 / 12 && lt < t + .25) e = Math.max(e, 1 - (lt - t + 1 / 12) / .33); b.scale.y *= 1 - .35 * e; b.position.y -= .03 * e; });

  notes.forEach(([t, k], i) => {

    const st = M(cylinder(.026, .4, 8), C.dark, 0); st.position.set(.1, .2, 0); st.userData.boil = 0; hd.userData.boil = 0; n.add(st);

  });

  c.on((lt, T) => { sparkLive(sp, lt, T); sp.rotation.z = Math.sin(lt * 5.86) * .15; });
  c.cam = lt => ({ pos: dolly([.2, 4.4, 9.6], [-.3, 3.8, 8.3], lt, c.dur), look: [-.2, 1.3, 0], focus: [-.5, 1.4, .1], aperture: .0014 });
}};

DEFS.outro = { build(c) {
  const letters = 'OPUS 5.5'.split(''); let x = -4.05; const widths = { O: 1.12, P: 1.0, U: 1.05, S: 1.0, ' ': .5, '5': .95, '.': .42 };
  letters.forEach((ch, i) => {
    const w = widths[ch]; x += w / 2;
    if (ch === '.') { const dot = c.add(M(sphere(.17, 24), C.cream, .01), x, .17, 0); c.drop(dot, c.at(0, 'Opus') + i * .1, 4, .6); }
    else if (ch !== ' ') { const m = c.add(text3d(ch, 1.25, [C.orange, C.yellow, C.teal, C.red, 0, C.blue, C.cream, C.green][i], .45), x, 0, 0); m.rotation.y = (i % 2 ? .06 : -.05); m.rotation.z = (i % 3 - 1) * .04; c.drop(m, c.at(0, 'Opus') + i * .1, 4, .6); }
    x += w / 2 + .05;
  });
  const sp = c.add(makeSpark(), 3.0, 2.75, -.9); sp.scale.setScalar(.62); c.pop(sp, .1);
  c.on((lt, T) => { sparkLive(sp, lt, T); if (lt > c.L[1]) sp.position.y += Math.abs(Math.sin((lt - c.L[1]) * 5)) * .5 * (1 - P(lt, c.L[1] + 2, .5)); });
  const bot = c.add(makeRobot(), -5.15, 0, -.9); bot.scale.setScalar(.72); bot.rotation.y = .55; c.pop(bot, .2);
  c.on(lt => { wave(bot, lt, c.L[1] - .2, 3); });
  // confetti
  seed = 3;
  for (let i = 0; i < 40; i++) {
    const m = c.add(M(i % 3 ? roundBox(.14, .03, .1, .01) : sphere(.06, 10), [C.orange, C.yellow, C.teal, C.red, C.blue, C.pink][i % 6], 0), 0, 0, 0);
    const vx = (rnd() - .5) * 7, vz = (rnd() - .5) * 3, vy = 5 + rnd() * 3, t0 = c.at(1, 'something') + rnd() * .3, rs = rnd() * 10;
    c.on(lt => { const t = lt - t0; m.visible = t > 0; if (t <= 0) return; const tt = Math.min(t, 2.2); m.position.set(vx * tt * .6, Math.max(.05, 1.8 + vy * tt - 4.9 * tt * tt), vz * tt * .6 + .8); m.rotation.set(rs * tt, rs * tt * .7, 0); });
  }

  const cr = document.getElementById('credits'), fade = document.getElementById('fade');
  cr.innerHTML = 'Modeled, lit &amp; animated in code by Claude Opus 5.5 · three.js · voice: Kokoro (open-source TTS)';
  c.on(lt => { cr.style.opacity = P(lt, c.end(1) + .6, .5); fade.style.opacity = P(lt, c.dur - .9, .8); });
  c.cam = lt => ({ pos: dolly([0, 2.4, 9.6], [0, 2.3, 10.4], lt, c.dur), look: [0, 1.25, 0], focus: [0, .6, 0], aperture: .0012 });
}};

// ---------- assemble ----------
const scenes = TL.scenes.map(s => makeScene(DEFS[s.id], s));
const CAP = [[/five point five/g, '5.5'], [/three hundred and fifty megabytes/, '350 MB'], [/open source/g, 'open-source']];
const cap = document.getElementById('cap'), slate = document.getElementById('slate'), badge = document.getElementById('badge'), cr = document.getElementById('credits');
const SLATES = { intro: 'Hello', model: '3D modeling', town: 'Procedural worlds', physics: 'Physics', code: 'Code', data: 'Data', music: 'Music', lang: 'Languages', agent: 'Agentic', voice: 'Making of: my voice', outro: 'Opus 5.5' };
const grain = document.getElementById('grain'), gctx = grain.getContext('2d');
const gimg = gctx.createImageData(680, 400);
window.render = function (T) {
  const n = Math.floor(T * SPS + 1e-6), tq = n / SPS;
  let cur = scenes.length - 1;
  for (let i = 0; i < scenes.length; i++) if (tq < scenes[i].info.start + scenes[i].info.dur) { cur = i; break; }
  key.intensity = 2.6; hemi.intensity = .95; world.background.setHex(0x2a1f18);
  badge.style.display = 'none'; cr.style.opacity = 0; document.getElementById('fade').style.opacity = 0;
  scenes.forEach((s, i) => { s.group.visible = i === cur; if (i !== cur) s.hideTags(); });
  const s = scenes[cur], lt = tq - s.info.start;
  s.update(lt, tq, n);
  key.intensity *= 1 + hash(n, 7) * .03;           // hand-cranked lighting flicker
  bokeh.uniforms.focus.value = camera.position.distanceTo(FOCUS); bokeh.uniforms.aperture.value = APERTURE;
  composer.render();
  const idx = scenes.indexOf(s);
  slate.innerHTML = `<b>${String(idx + 1).padStart(2, '0')}</b>${SLATES[s.info.id]}`;
  slate.style.opacity = s.info.id === 'outro' ? 1 - P(lt, .1, .3) : P(lt, .3, .3);
  const ln = s.info.lines.find(l => lt >= l.start - .05 && lt <= l.start + l.dur + .25);
  cap.style.visibility = ln ? 'visible' : 'hidden'; if (ln) cap.textContent = CAP.reduce((a, [r, b]) => a.replace(r, b), ln.text);
  cap.style.transform = `translateX(-50%) rotate(${hash(n >> 2, 5) * .8}deg)`;
  // iris wipe between scenes (closes on the old scene, opens on the new one)
  let ir = 1;
  scenes.forEach((q, i) => { const tb = q.info.start; if (tq > tb - .38 && tq < tb + .42) ir = Math.min(ir, tq < tb ? (i ? 1 - eio(P(tq, tb - .38, .38)) : 0) : eio(P(tq, tb - .02, .42))); });
  const rr = ir * 760;
  document.getElementById('iris').style.background = ir >= 1 ? 'none' : `radial-gradient(circle at 50% 46%, transparent ${rr}px, #140e0a ${rr + 2}px)`;
  // film grain, new every pose
  let sd = n * 9301 + 49297; const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { sd = (sd * 16807) % 2147483647; const v = (sd & 255); d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  gctx.putImageData(gimg, 0, 0);
};
window.TOTAL = TL.total; window.EVENTS = EVENTS;
render(0);
window.READY = true;
