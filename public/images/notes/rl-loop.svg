<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Feedback changes the next attempt</title><desc id="desc">A policy acts in an environment. The environment returns a new observation. A reward scores the outcome, and learning uses experience to update the policy.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#425ca8"/></marker></defs>
<rect width="960" height="520" rx="12" fill="#eef1f5"/>
<text x="40" y="48" fill="#273044" font-family="Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Feedback changes the next attempt</text><text x="40" y="79" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">A conceptual reinforcement learning loop</text><rect x="70" y="168" width="210" height="108" rx="12" fill="#d5c9e9"/><text x="175.0" y="222.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Policy</text><text x="175.0" y="251.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">choose an action</text><rect x="390" y="168" width="235" height="108" rx="12" fill="#c1ded4"/><text x="507.5" y="222.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Environment</text><text x="507.5" y="251.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">run the interaction</text><rect x="705" y="168" width="185" height="108" rx="12" fill="#ecdfa4"/><text x="797.5" y="222.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Reward</text><text x="797.5" y="251.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">score the outcome</text><path d="M282 222 L383 222" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="334" y="198" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">action</text><path d="M630 222 L698 222" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M795 285 V394 H176 V285" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="490" y="381" fill="#425ca8" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">Learning updates the policy from collected experience</text><path d="M505 162 V119 H176 V162" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="340" y="111" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">next observation</text><text x="40" y="478" fill="#697489" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">For an LLM: context → generated tokens or tool calls → feedback</text>
</svg>