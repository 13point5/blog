<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Learn a world. Practice inside it.</title><desc id="desc">Real environment experience trains a world model. The model produces imagined rollouts for learning a policy and value function. The policy then gathers further real experience.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#425ca8"/></marker></defs>
<rect width="960" height="520" rx="12" fill="#eef1f5"/>
<text x="40" y="48" fill="#273044" font-family="Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Learn a world. Practice inside it.</text><text x="40" y="79" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">A conceptual loop inspired by latent world-model agents</text><rect x="50" y="148" width="205" height="100" rx="12" fill="#c1ded4"/><text x="152.5" y="198.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Experience</text><text x="152.5" y="227.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">from the environment</text><rect x="376" y="148" width="205" height="100" rx="12" fill="#d5c9e9"/><text x="478.5" y="198.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">World model</text><text x="478.5" y="227.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">learned dynamics</text><rect x="702" y="148" width="205" height="100" rx="12" fill="#f2d4b9"/><text x="804.5" y="198.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Imagined rollout</text><text x="804.5" y="227.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">predicted states</text><path d="M261 198 L368 198" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="314" y="178" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">fit</text><path d="M588 198 L693 198" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="641" y="178" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">simulate</text><rect x="376" y="354" width="205" height="94" rx="12" fill="#ecdfa4"/><text x="478.5" y="401.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Policy + value</text><text x="478.5" y="430.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">learn from rollouts</text><path d="M804 255 V400 H590" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M368 400 H152 V256" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="182" y="381" fill="#697489" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">act</text><text x="684" y="381" fill="#697489" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">improve</text>
