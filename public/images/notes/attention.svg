<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Mix information. Transform it. Repeat.</title><desc id="desc">A lower-triangular mask permits causal attention to current and earlier positions. Self-attention mixes information between tokens; a feed-forward network transforms each position. Residual paths carry information around sublayers. Normalization and projections are omitted.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#425ca8"/></marker></defs>
<rect width="960" height="520" rx="12" fill="#eef1f5"/>
<text x="40" y="48" fill="#273044" font-family="Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Mix information. Transform it. Repeat.</text><text x="40" y="79" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Two different jobs inside a decoder-style Transformer block</text><text x="60" y="138" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">CAUSAL VISIBILITY</text><rect x="75" y="162" width="38" height="38" rx="4" fill="#425ca8"/><rect x="122" y="162" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="169" y="162" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="216" y="162" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="263" y="162" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="75" y="209" width="38" height="38" rx="4" fill="#425ca8"/><rect x="122" y="209" width="38" height="38" rx="4" fill="#425ca8"/><rect x="169" y="209" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="216" y="209" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="263" y="209" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="75" y="256" width="38" height="38" rx="4" fill="#425ca8"/><rect x="122" y="256" width="38" height="38" rx="4" fill="#425ca8"/><rect x="169" y="256" width="38" height="38" rx="4" fill="#425ca8"/><rect x="216" y="256" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="263" y="256" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="75" y="303" width="38" height="38" rx="4" fill="#425ca8"/><rect x="122" y="303" width="38" height="38" rx="4" fill="#425ca8"/><rect x="169" y="303" width="38" height="38" rx="4" fill="#425ca8"/><rect x="216" y="303" width="38" height="38" rx="4" fill="#425ca8"/><rect x="263" y="303" width="38" height="38" rx="4" fill="#dde2eb"/><rect x="75" y="350" width="38" height="38" rx="4" fill="#425ca8"/><rect x="122" y="350" width="38" height="38" rx="4" fill="#425ca8"/><rect x="169" y="350" width="38" height="38" rx="4" fill="#425ca8"/><rect x="216" y="350" width="38" height="38" rx="4" fill="#425ca8"/><rect x="263" y="350" width="38" height="38" rx="4" fill="#425ca8"/><text x="181" y="434" fill="#697489" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Earlier tokens are visible.</text><text x="181" y="459" fill="#697489" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Future tokens are masked.</text><rect x="406" y="148" width="228" height="82" rx="12" fill="#d5c9e9"/><text x="520.0" y="189.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Self-attention</text><text x="520.0" y="218.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">mix across positions</text><rect x="406" y="308" width="228" height="82" rx="12" fill="#f2d4b9"/><text x="520.0" y="349.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Feed-forward</text><text x="520.0" y="378.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">transform each position</text><path d="M520 235 L520 299" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M642 350 L711 350" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="724" y="308" width="174" height="82" rx="12" fill="#c1ded4"/><text x="811.0" y="357.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Next layer</text><path d="M406 185 H358 V414 H680 V350" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="404" y="447" fill="#697489" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Residual paths preserve and update the stream.</text><text x="408" y="478" fill="#697489" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Schematic; normalization and projections omitted.</text>
</svg>