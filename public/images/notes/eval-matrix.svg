<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Evaluation is a matrix, not a podium</title><desc id="desc">Three task types are considered across success, cost, robustness, and execution traces. Colored cells are placeholders for review activities, not measured performance.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#425ca8"/></marker></defs>
<rect width="960" height="520" rx="12" fill="#eef1f5"/>
<text x="40" y="48" fill="#273044" font-family="Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Evaluation is a matrix, not a podium</text><text x="40" y="79" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Illustrative review dimensions — no model scores are plotted</text><text x="53" y="143" fill="#697489" font-family="Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">SAME MODEL</text><text x="265" y="143" fill="#273044" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Task success</text><text x="450" y="143" fill="#273044" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Cost</text><text x="595" y="143" fill="#273044" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Robustness</text><text x="787" y="143" fill="#273044" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Trace</text><text x="53" y="208" fill="#273044" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Code edit</text><rect x="255" y="170" width="145" height="59" rx="8" fill="#ecdfa4"/><text x="327" y="207" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">compare</text><rect x="420" y="170" width="145" height="59" rx="8" fill="#d5c9e9"/><text x="492" y="207" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">repeat</text><rect x="585" y="170" width="145" height="59" rx="8" fill="#ecdfa4"/><text x="657" y="207" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">compare</text><rect x="750" y="170" width="145" height="59" rx="8" fill="#c1ded4"/><rect x="770" y="185" width="55" height="3" rx="1" fill="#7a8596"/><rect x="770" y="196" width="75" height="3" rx="1" fill="#7a8596"/><rect x="770" y="207" width="95" height="3" rx="1" fill="#7a8596"/><text x="53" y="285" fill="#273044" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Tool use</text><rect x="255" y="247" width="145" height="59" rx="8" fill="#d5c9e9"/><text x="327" y="284" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">repeat</text><rect x="420" y="247" width="145" height="59" rx="8" fill="#ecdfa4"/><text x="492" y="284" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">compare</text><rect x="585" y="247" width="145" height="59" rx="8" fill="#c1ded4"/><text x="657" y="284" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">inspect</text><rect x="750" y="247" width="145" height="59" rx="8" fill="#ecdfa4"/><rect x="770" y="262" width="55" height="3" rx="1" fill="#7a8596"/><rect x="770" y="273" width="75" height="3" rx="1" fill="#7a8596"/><rect x="770" y="284" width="95" height="3" rx="1" fill="#7a8596"/><text x="53" y="362" fill="#273044" font-family="Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Long task</text><rect x="255" y="324" width="145" height="59" rx="8" fill="#c1ded4"/><text x="327" y="361" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">inspect</text><rect x="420" y="324" width="145" height="59" rx="8" fill="#ecdfa4"/><text x="492" y="361" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">compare</text><rect x="585" y="324" width="145" height="59" rx="8" fill="#d5c9e9"/><text x="657" y="361" fill="#273044" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">repeat</text><rect x="750" y="324" width="145" height="59" rx="8" fill="#d5c9e9"/><rect x="770" y="339" width="55" height="3" rx="1" fill="#7a8596"/><rect x="770" y="350" width="75" height="3" rx="1" fill="#7a8596"/><rect x="770" y="361" width="95" height="3" rx="1" fill="#7a8596"/><text x="53" y="463" fill="#425ca8" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">One aggregate score cannot describe every task and failure mode.</text>
