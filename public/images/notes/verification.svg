<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Generation proposes. Verification checks.</title><desc id="desc">A formal statement and a proposed proof are submitted to the kernel. Rejected attempts can be revised. A checked proof establishes the encoded proposition under its axioms, not the correctness of the original informal specification.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#425ca8"/></marker></defs>
<rect width="960" height="520" rx="12" fill="#eef1f5"/>
<text x="40" y="48" fill="#273044" font-family="Arial, sans-serif" font-size="27" font-weight="500" text-anchor="start">Generation proposes. Verification checks.</text><text x="40" y="79" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Separating proof search from proof checking</text><rect x="60" y="155" width="226" height="102" rx="12" fill="#c1ded4"/><text x="173.0" y="206.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Formal statement</text><text x="173.0" y="235.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">what must be true</text><rect x="368" y="155" width="224" height="102" rx="12" fill="#d5c9e9"/><text x="480.0" y="206.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Proposed proof</text><text x="480.0" y="235.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">from a model or tactic</text><rect x="676" y="155" width="224" height="102" rx="12" fill="#ecdfa4"/><text x="788.0" y="206.0" fill="#273044" font-family="Arial, sans-serif" font-size="23" font-weight="500" text-anchor="middle">Kernel checks</text><text x="788.0" y="235.0" fill="#697489" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">against the statement</text><path d="M293 208 L360 208" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M598 208 L668 208" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M788 265 V330 H483 V265" stroke="#425ca8" stroke-width="3" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="630" y="319" fill="#697489" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle">feedback / retry</text><rect x="60" y="383" width="840" height="73" rx="9" fill="#e0e5ee"/><text x="480" y="414" fill="#425ca8" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="middle">A checked proof establishes the formal claim under its assumptions.</text><text x="480" y="442" fill="#697489" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">It does not check whether that claim matches your intention.</text>
</svg>